<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AG DLC Compare</title>
<style>
  :root { --bg: #111317; --panel: #1b1e24; --text: #d8dde6; --muted: #8a93a3; --accent: #57c7ff; --warn: #ffb057; --bad: #ff6b6b; --ok: #6fdc8c; }
  :root[data-theme="light"] { --bg: #f4f5f7; --panel: #ffffff; --text: #1c2230; --muted: #5d6677; --accent: #0a7bd6; --warn: #b36b00; --bad: #c62828; --ok: #2e7d32; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid #0003; }
  header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
  header label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
  select, button, input[type=range] { font: inherit; }
  select, button { background: var(--bg); color: var(--text); border: 1px solid #fff2; border-radius: 6px; padding: 4px 8px; }
  button.on { border-color: var(--accent); color: var(--accent); }
  #frame { width: min(420px, 60vw); }
  main { padding: 12px 16px; display: grid; gap: 12px; }
  #stage { position: relative; width: 100%; max-width: 1600px; aspect-ratio: 16 / 9; background: #000; overflow: hidden; border-radius: 6px; }
  #stage canvas, #stage img, #stage video { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stage.side { display: grid; grid-template-columns: 1fr 1fr; aspect-ratio: 32 / 9; }
  #stage.side canvas, #stage.side img, #stage.side video { position: relative; }
  #divider { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .tag { position: absolute; top: 8px; padding: 2px 8px; border-radius: 4px; background: #000a; color: #fff; font-size: 12px; pointer-events: none; }
  #info { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border-radius: 6px; padding: 10px 12px; }
  .card h2 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .card pre { margin: 0; white-space: pre-wrap; max-height: 220px; overflow: auto; font-size: 12px; }
  #score { font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  @media (max-width: 700px) { header { padding: 8px 16px; } #stage.side { grid-template-columns: 1fr; aspect-ratio: 16 / 18; } }
</style>
</head>
<body>
<header>
  <h1 id="title">AG DLC compare</h1>
  <label>Sequence <select id="seq"></select></label>
  <button id="play">Play</button>
  <label>Frame <input id="frame" type="range" min="0" max="0" value="0"> <span id="flabel">0</span></label>
  <label title="Paused on the exact Unity reference images (PNG, every 15th frame); off: any frame, from the full-rate Unity video"><input id="snap" type="checkbox" checked> exact reference frames only</label>
  <label>Unity <select id="refset"><option value="unity">with post</option><option value="unity_raw">without post</option></select></label>
  <label><input id="post" type="checkbox" checked> WebGPU post</label>
  <label>View
    <select id="mode">
      <option value="side">Side by side</option>
      <option value="swipe">Swipe</option>
      <option value="blink">Blink (space)</option>
      <option value="diff">Difference</option>
      <option value="web">WebGPU only</option>
      <option value="unity">Unity only</option>
    </select>
  </label>
  <span id="score"></span>
</header>
<main>
  <div id="stage">
    <canvas id="gpu" width="1600" height="900"></canvas>
    <img id="ref" alt="">
    <video id="refv" muted playsinline preload="auto" hidden></video>
    <canvas id="diff" width="1600" height="900" hidden></canvas>
    <div id="divider" hidden></div>
    <span class="tag" id="tagL" style="left:8px">WebGPU</span>
    <span class="tag" id="tagR" style="right:8px">Unity</span>
  </div>
  <div id="info">
    <div class="card"><h2>Status</h2><pre id="status">loading…</pre></div>
    <div class="card"><h2>Uniforms the port does not supply yet</h2><pre id="missing"></pre></div>
    <div class="card"><h2>Errors</h2><pre id="errors"></pre></div>
  </div>
</main>
<audio id="audio" preload="auto"></audio>
<script type="module" src="js/main.js"></script>
</body>
</html>
